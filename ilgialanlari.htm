  <div class='container'>        
    <form id="musicForm" action=''>
<button id="submit" class="btn btn-primary">Gönder</button>
        
        <input type='hidden' id='hidden_token'>
        <div class='col-sm-6 form-group row mt-4 px-0'>
            <label for='Genre' class='form-label col-sm-2' style="color: rgb(255, 255, 255);">Tür:</label>
            <select name='' id='select_genre' class='form-control form-control-sm col-sm-10'>
                <option>Select...</option>                    
            </select>
        </div>
        <div class='col-sm-6 form-group row px-0'>
            <label for='Genre' class='form-label col-sm-2' style="color: rgb(255, 255, 255);">Çalma Listeleri:</label>
            <select name='' id='select_playlist' class='form-control form-control-sm col-sm-10'>
                <option>Select...</option>                    
            </select>
        </div>                  
        <div class='col-sm-6 row form-group px-0'>
            <button type='submit' id='btn_submit' class='btn btn-success col-sm-12'>Search</button>
        </div>          
    </form>        
    <div class='row'>
        <div class='col-sm-6 px-0'>
            <div class='list-group song-list' id="song_list">
                
            </div>                                             
        </div>
        <div class='offset-md-1 col-sm-4' id='song-detail' >                
        </div>
    </div>   
</div>
<script>
  // Güncellenmiş müzik türleri ve listeler
  const genres = {
    "Rock": ["Say Goodbye as We Dance with the Devils Tonight", "neverending circle"],
    "Türkçe Rock": ["Lavaş'ın Süt İçerken Dinledikleri", "Yeni Nesil Rock"],
    "Klasik": ["Elizabeth Bennet"],
    "Arabesk": ["Orhan Gencebay Özel", "Yorgunuz Baba"]
  };

  const songs = {
    "Say Goodbye as We Dance with the Devils Tonight": ["Breaking Benjamin– Dance with the Devil", "Three Days Grace – I Am Machine", "Charon – Bullet "],
    "neverending circle": ["Linkin Park – Heavu is the Crown", "The Killers– Mr. Brightside"],
    "Lavaş'ın Süt İçerken Dinledikleri": ["Yüksek Sadakat – Ben Seni Arayamam", "Athena – Kafama Göre"],
    "Yeni Nesil Rock": ["Yüzyüzeyken Konuşuruz – Bodrum", "Mavi Gri – Ölümle Yaşam Arasında"],
    "Elizabeth Bennet": ["5. Senfoni", "Ay Işığı Sonatı"],
    "Orhan Gencebay Özel": ["Dil Yarası", "Batsın Bu Dünya"],
    "Yorgunuz Baba": ["Bergen – Sen Affetsen", "Bergen – Benim için Üzülme"],
  };

  const genreSelect = document.getElementById('select_genre');
  const playlistSelect = document.getElementById('select_playlist');
  const songListDiv = document.getElementById('song_list');
  const songDetailDiv = document.getElementById('song-detail');

  // Türleri doldur
  for (let genre in genres) {
    const option = document.createElement('option');
    option.value = genre;
    option.textContent = genre;
    genreSelect.appendChild(option);
  }

  // Tür seçilince listeleri doldur
  genreSelect.addEventListener('change', function() {
    playlistSelect.innerHTML = '<option value="">Seçiniz...</option>';
    const selectedGenre = genreSelect.value;
    if (genres[selectedGenre]) {
      genres[selectedGenre].forEach(playlist => {
        const option = document.createElement('option');
        option.value = playlist;
        option.textContent = playlist;
        playlistSelect.appendChild(option);
      });
    }
  });

  // Form gönderilince şarkıları listele
  document.getElementById('musicForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const selectedPlaylist = playlistSelect.value;
    songListDiv.innerHTML = '';
    songDetailDiv.innerHTML = '';
    if (songs[selectedPlaylist]) {
      songs[selectedPlaylist].forEach(song => {
        const item = document.createElement('button');
        item.className = 'list-group-item list-group-item-action';
        item.textContent = song;
        item.onclick = () => {
          songDetailDiv.innerHTML = `<h5>${song}</h5><p>Bu şarkıya ait detaylar burada gösterilebilir.</p>`;
        };
        songListDiv.appendChild(item);
      });
    }
  });
</script>
